<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#21262d" stroke-width="1" opacity="0.5">
    <line x1="0" y1="125" x2="800" y2="125"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Central AI core glow -->
  <circle cx="400" cy="250" r="180" fill="url(#glow)"/>

  <!-- Central AI core -->
  <g>
    <circle cx="400" cy="250" r="70" fill="none" stroke="url(#ai)" stroke-width="3"/>
    <circle cx="400" cy="250" r="52" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="400" cy="250" r="30" fill="url(#ai)"/>
    <g stroke="#0d1117" stroke-width="3" stroke-linecap="round">
      <line x1="400" y1="220" x2="400" y2="205"/>
      <line x1="400" y1="280" x2="400" y2="295"/>
      <line x1="370" y1="250" x2="355" y2="250"/>
      <line x1="430" y1="250" x2="445" y2="250"/>
    </g>
    <text x="400" y="355" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700">LocalAI</text>
    <text x="400" y="382" text-anchor="middle" fill="#8b949e" font-size="14">100% on-premise · fully offline</text>
  </g>

  <!-- Connection lines to nodes -->
  <g stroke="#2dd4bf" stroke-width="2" opacity="0.75">
    <line x1="400" y1="250" x2="170" y2="120"/>
    <line x1="400" y1="250" x2="630" y2="120"/>
    <line x1="400" y1="250" x2="170" y2="380"/>
    <line x1="400" y1="250" x2="630" y2="380"/>
  </g>

  <!-- Node: Documents (RAG) -->
  <g>
    <rect x="90" y="70" width="160" height="70" rx="10" fill="#0d1117" stroke="url(#doc)" stroke-width="2"/>
    <rect x="115" y="88" width="24" height="34" rx="3" fill="url(#doc)"/>
    <rect x="145" y="90" width="60" height="4" fill="#58a6ff"/>
    <rect x="145" y="100" width="60" height="4" fill="#58a6ff"/>
    <rect x="145" y="110" width="45" height="4" fill="#58a6ff"/>
    <text x="115" y="130" fill="#e6edf3" font-size="13" font-weight="600">100k+ documents</text>
  </g>

  <!-- Node: JIRA live ingest -->
  <g>
    <rect x="550" y="70" width="180" height="70" rx="10" fill="#0d1117" stroke="#f0883e" stroke-width="2"/>
    <circle cx="580" cy="105" r="12" fill="none" stroke="#f0883e" stroke-width="2"/>
    <circle cx="580" cy="105" r="4" fill="#f0883e"/>
    <rect x="600" y="92" width="90" height="4" fill="#58a6ff"/>
    <rect x="600" y="102" width="70" height="4" fill="#58a6ff"/>
    <rect x="600" y="112" width="80" height="4" fill="#38bdf8"/>
    <text x="575" y="130" fill="#e6edf3" font-size="13" font-weight="600">Live JIRA ingestion</text>
  </g>

  <!-- Node: Dev agent -->
  <g>
    <rect x="550" y="340" width="180" height="70" rx="10" fill="#0d1117" stroke="#2dd4bf" stroke-width="2"/>
    <text x="572" y="375" fill="#38bdf8" font-family="'Courier New', monospace" font-size="16">&gt;_ agent</text>
    <rect x="620" y="360" width="80" height="4" fill="#8b949e"/>
    <rect x="620" y="370" width="60" height="4" fill="#8b949e"/>
    <rect x="620" y="380" width="70" height="4" fill="#8b949e"/>
    <text x="575" y="400" fill="#e6edf3" font-size="13" font-weight="600">Local dev agent</text>
  </g>

  <!-- Node: Security -->
  <g>
    <rect x="90" y="340" width="160" height="70" rx="10" fill="#0d1117" stroke="#a3e635" stroke-width="2"/>
    <path d="M120 365 l0 -8 a10 10 0 0 1 20 0 l0 8 z" fill="none" stroke="#a3e635" stroke-width="2"/>
    <rect x="122" y="365" width="16" height="14" fill="#a3e635" opacity="0.3"/>
    <rect x="145" y="365" width="70" height="4" fill="#58a6ff"/>
    <rect x="145" y="375" width="55" height="4" fill="#58a6ff"/>
    <text x="115" y="400" fill="#e6edf3" font-size="13" font-weight="600">Secure topics</text>
  </g>

  <!-- flowing data dots -->
  <g fill="#2dd4bf" filter="url(#soft)">
    <circle cx="285" cy="185" r="4"/>
    <circle cx="515" cy="185" r="4"/>
    <circle cx="285" cy="315" r="4"/>
    <circle cx="515" cy="315" r="4"/>
  </g>
</svg>